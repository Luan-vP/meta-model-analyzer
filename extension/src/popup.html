<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta-Model Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #2b2215;
      background-color: #f3efe0;
      background-image: url('textures/notebook.png'), url('textures/paper.png');
      background-blend-mode: multiply, normal;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #d6c7b1;
      background-color: #ede3cf;
      background-image: url('textures/handmade-paper.png');
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #2b2215;
    }
    .header p {
      font-size: 11px;
      color: #7a6b5c;
      margin-top: 2px;
    }
    .settings {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #5e5246;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d6c7b1;
      border-radius: 6px;
      font-size: 13px;
      background: #f3efe0;
      color: #2b2215;
    }
    .field input:focus {
      outline: none;
      border-color: #c0763b;
      box-shadow: 0 0 0 2px rgba(192,118,59,0.18);
    }
    .field .hint {
      font-size: 10px;
      color: #7a6b5c;
      margin-top: 3px;
    }
    .actions {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #c0763b;
      color: #fff;
    }
    .btn-primary:hover {
      background: #a05e2a;
    }
    .btn-primary:disabled {
      background: #d6c7b1;
      color: #7a6b5c;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #ede3cf;
      color: #5e5246;
    }
    .btn-secondary:hover {
      background: #d6c7b1;
    }
    .status {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #5e5246;
      border-top: 1px solid #d6c7b1;
      background-color: #ede3cf;
      background-image: url('textures/handmade-paper.png');
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c8b89e;
    }
    .status-dot.connected {
      background: #22c55e;
    }
    .status-dot.error {
      background: #ef4444;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #d6c7b1;
      border-top-color: #c0763b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧠 Meta-Model Analyzer</h1>
    <p>Select text on any page, then click "Analyze Selection"</p>
  </div>

  <div class="settings">
    <div class="field">
      <label for="ollama-url">Ollama URL</label>
      <input id="ollama-url" type="text" value="http://localhost:11434" />
      <div class="hint">Where Ollama is running</div>
    </div>
    <div class="field">
      <label for="model-name">Model</label>
      <input id="model-name" type="text" value="llama3.1:8b" />
      <div class="hint">Any Ollama model (e.g., llama3.2, qwen2.5:7b)</div>
    </div>
  </div>

  <div class="actions">
    <button id="btn-analyze" class="btn btn-primary" disabled>Analyze Selection</button>
    <button id="btn-check" class="btn btn-secondary">Check Ollama Connection</button>
  </div>

  <div class="status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Not checked</span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
